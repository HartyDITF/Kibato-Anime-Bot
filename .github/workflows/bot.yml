name: Kibato Anime Bot

permissions:
  contents: write

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:


jobs:

  run-bot:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install
        run: npm install


      - name: Run Kibato Anime
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node src/index.js


      - name: Save sent database
  run: |

    git config user.name "Kibato Anime Bot"

    git config user.email "kibato-bot@users.noreply.github.com"

    git add sent.json || true

    git commit -m "Update sent episodes" || exit 0

    git push
